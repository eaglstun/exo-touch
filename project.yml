name: ExoIPadSpike
options:
  bundleIdPrefix: com.eaglstun
  deploymentTarget:
    iOS: "18.0"
packages:
  MLXSwift:
    # mlx-swift 0.33.0 (MLX 36969c09, v0.32.4, the same commit exo runs: one ring protocol on every
    # rank) plus patches/mlx-swift-0.33.0-sdpa-lse.patch; mac/vendor_mlx_swift.sh fetches and patches it
    path: Vendor/mlx-swift
targets:
  ExoIPadSpike:
    type: application
    platform: iOS
    sources: [Sources]
    entitlements:
      path: ExoIPadSpike.entitlements
      properties:
        # Lets iPadOS give this app more memory before it ends it (the default limit leaves
        # about a third of a 16 GB iPad): a stage holds a model's layers and their KV caches
        com.apple.developer.kernel.increased-memory-limit: true
        # A larger virtual address space, for arrays past the default per-app limit
        com.apple.developer.kernel.extended-virtual-addressing: true
    dependencies:
      - package: MLXSwift
        product: MLX
    settings:
      base:
        DEVELOPMENT_TEAM: EKNXJ2NR3G
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.eaglstun.ExoIPadSpike
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Joins an MLX ring with your Mac to test distributed inference.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
